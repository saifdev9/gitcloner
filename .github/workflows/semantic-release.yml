# Every push to main: test, then let semantic-release read the commit messages
# since the last tag and decide the next version.
#
#   fix: ...                        -> 0.2.0 -> 0.2.1
#   feat: ...                       -> 0.2.0 -> 0.3.0
#   feat!: ...  / BREAKING CHANGE:  -> 0.2.0 -> 1.0.0
#   docs:, chore:, refactor:, ...   -> no release
#
# It writes the version into Cargo.toml / Cargo.lock, commits that, tags it
# vX.Y.Z, then starts the Release workflow (dist), which builds the binaries
# and installers and publishes the GitHub Release.
#
# The Release workflow is started with `gh workflow run` rather than by the
# tag push: GitHub does not let a push made with GITHUB_TOKEN trigger other
# workflows, but it does allow a workflow_dispatch.

name: Semantic Release

on:
  push:
    branches: [main]

permissions:
  contents: write # push the version commit and the tag
  actions: write # start the Release workflow

concurrency:
  group: semantic-release
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: cargo test --locked

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # every commit and tag since the last release
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Version, commit and tag
        id: version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          npx --yes
          -p semantic-release@25
          -p @semantic-release/exec@7
          -p @semantic-release/git@11
          semantic-release
      - name: Build and publish the release
        if: steps.version.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh workflow run release.yml --ref "$TAG" -f tag="$TAG"
