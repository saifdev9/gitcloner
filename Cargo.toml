[package]
name = "gitcloner"
version = "0.1.0"
edition = "2024"
description = "A terminal UI for cloning many git repos at once — public or private, or picked from a GitHub org"
license = "MIT"
repository = "https://github.com/saifdev9/gitcloner"
homepage = "https://github.com/saifdev9/gitcloner"
readme = "README.md"

[dependencies]
ratatui = "0.30.2"
serde_json = "1.0.154"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
